{% extends "base.html" %}

{% block title %}Choose Role - Cartify{% endblock title %}

{% load static %}
{% block extra_head %}
<link rel="stylesheet" href="{% static "users/role.css" %}">
{% endblock extra_head %}

{% block body  %}
<div class="container">
    <div class="logo">
        <div class='img'>
            <img src="{% static "svgs/cart.svg" %}" alt="">
        </div>
        <span>Cartify</span>
    </div>
    <div class="tagline">Choose Your Role</div>

    <form action="{% url "registerUser" %}" method="get">
        <div class="role-selection">
            <div class="role-option">
                <input type="radio" id="buyer" name="role" value="buyer" required>
                <label for="buyer">
                    <span class="role-icon">🛍</span>
                    <span class="role-name">Buyer</span>
                    <span class="role-desc">Browse and buy products</span>
                </label>
            </div>
            <div class="role-option">
                <input type="radio" id="seller" name="role" value="seller" required>
                <label for="seller">
                    <span class="role-icon">🏪</span>
                    <span class="role-name">Seller</span>
                    <span class="role-desc">List and sell your products</span>
                </label>
            </div>
        </div>
        <button type="submit" class="continue-button">Continue</button>
    </form>
</div>
{% endblock body  %}
